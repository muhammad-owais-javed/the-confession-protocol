<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession Protocol - Test Client</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #111; color: #e0e0e0; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .game-container { display: flex; width: 90%; max-width: 1200px; height: 80vh; background-color: #1a1a1a; border: 1px solid #333; }
        .character-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .character-panel img { max-width: 80%; max-height: 300px; object-fit: cover; filter: grayscale(1) brightness(0.6); }
        .character-panel h3 { color: #ff4d4d; }
        .interaction-panel { flex: 2; padding: 40px; border-left: 1px solid #333; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #phase-title { color: #ff4d4d; border-bottom: 1px solid #444; padding-bottom: 10px; text-align: center; }
        #dialogue-box { background-color: #2a2a2a; border-left: 3px solid #ff4d4d; padding: 20px; margin: 20px 0; font-style: italic; flex-grow: 1; overflow-y: auto; }
        #choices-box button { display: block; width: 100%; padding: 15px; margin-top: 10px; font-size: 16px; background-color: #333; color: #fff; border: 1px solid #555; cursor: pointer; text-align: left; }
        #choices-box button:hover { background-color: #ff4d4d; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- SUBJECT'S PANEL -->
        <div class="character-panel">
            <h3>SUBJECT 07</h3>
            <img src="subject.jpg" alt="Subject">
            <div id="dialogue-box">
                <p id="dialogue-text">Connecting to the Bureau...</p>
            </div>
        </div>

        <!-- INTERACTION (PLAYER'S) PANEL -->
        <div class="interaction-panel">
            <h2 id="phase-title">Loading...</h2>
            <div id="choices-box">
                <!-- Buttons will be generated here by JavaScript -->
            </div>
        </div>

        <!-- AUDITOR'S PANEL -->
        <div class="character-panel">
            <h3>AUDITOR 07</h3>
            <img src="auditor.jpeg" alt="Auditor">
        </div>
    </div>

    <script>
        // --- The JavaScript is exactly the same as before! ---
        const phaseTitle = document.getElementById('phase-title');
        const dialogueText = document.getElementById('dialogue-text');
        const choicesBox = document.getElementById('choices-box');

        function updateUI(gameState) {
            phaseTitle.textContent = gameState.currentPhase;
            dialogueText.textContent = gameState.dialogue;
            choicesBox.innerHTML = '';

            gameState.availableChoices.forEach(choiceText => {
                const button = document.createElement('button');
                button.textContent = choiceText;
                button.onclick = () => makeChoice(choiceText);
                choicesBox.appendChild(button);
            });
        }

        async function makeChoice(choiceText) {
            const choiceData = { choiceText: choiceText };
            const response = await fetch('/choice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(choiceData)
            });
            const newGameState = await response.json();
            updateUI(newGameState);
        }

        async function startGame() {
            const response = await fetch('/start');
            const initialGameState = await response.json();
            updateUI(initialGameState);
        }

        startGame();
    </script>
</body>
</html>
